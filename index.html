<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: "Arial", sans-serif;
      background: #fff0f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 350px;
    }

    img {
      width: 220px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    h2 {
      margin-bottom: 20px;
      color: #e91e63;
    }

    .buttons {
      position: relative;
      height: 70px;
    }

    button {
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yesBtn {
      background-color: #4caf50;
      color: white;
      position: relative;
      z-index: 2;
    }

    #noBtn {
      background-color: #f44336;
      color: white;
      margin-left: 10px;
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body>
  <div class="card">
    
    <!-- Minion Valentine GIF -->
    <img src="minion1.jpg" alt="Valentine Minion">

    <h2 id="question">Will you be my Valentine? 💖</h2>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    const question = document.getElementById("question");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    let noCount = 0;
    let yesSize = 1;

    const noTexts = [
      "Are you sure? 😳",
      "Really sure?? 😢",
      "Please please click yes, baby 🥺",
      "Don’t break my heart 💔",
      "Okay now you’re just playing 😭"
    ];

    noBtn.addEventListener("click", () => {
      noCount++;

      // Change question text
      question.innerText = noTexts[Math.min(noCount - 1, noTexts.length - 1)];

      // Grow YES button
      yesSize += 0.4;
      yesBtn.style.transform = `scale(${yesSize})`;

      // Eventually hide NO button
      if (yesSize > 3) {
        noBtn.style.display = "none";
      }
    });

    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          height:100vh;
          background:#ffe6f0;
          text-align:center;
          font-family:Arial;
        ">
          <h1 style="color:#e91e63;">YAAAY!!! 💖💖💖</h1>
          <img src="funny fireworks.jpg" width="250">
          <p style="font-size:22px;">Best Valentine ever 🥰</p>
        </div>
      `;
    });
  </script>
</body>
</html>
